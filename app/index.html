<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 컴퓨터에 개발자용 작업실 꾸미기</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 36px;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .badge {
            display: inline-block;
            background: #38bdf8;
            color: #0f172a;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }
        h1 {
            margin: 0 0 12px 0;
            font-size: 1.8rem;
            color: #e2e8f0;
        }
        p {
            color: #94a3b8;
            line-height: 1.6;
        }
        .info-box {
            background: #0f172a;
            border-left: 4px solid #38bdf8;
            padding: 14px 18px;
            margin-top: 20px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.95rem;
            color: #bae6fd;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Docker Custom Image v1.0</span>
        <h1>🚀 개발 워크스테이션 구축 완료!</h1>
        <p>이 페이지는 커스텀 <strong>Dockerfile (nginx:alpine 기반)</strong> 컨테이너에서 실행 중인 웹 서버 응답 화면입니다.</p>
        <div class="info-box">
            <div>Base Image: nginx:alpine</div>
            <div>Status: Running &amp; Port Mapped</div>
            <div>Mode: Production Container</div>
        </div>
    </div>
</body>
</html>
