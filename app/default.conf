server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        add_header X-Workstation-Env $hostname always;
    }

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "OK - Healthy\n";
    }
}

